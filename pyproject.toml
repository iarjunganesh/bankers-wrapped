[project]
name = "bankers-wrapped"
version = "2.0.0"
description = "AI-powered financial storytelling platform — Backblaze Generative Media Hackathon 2026"
authors = [{name = "Arjun Ganesh", email = "iarjunganesh@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    # Web framework
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.9",
    # Config
    "pydantic>=2.13.4",
    "pydantic-settings>=2.3.0",
    # AI / Genblaze (v0.6.0 release wave: Windows file:// upload fix, ReDoS
    # hardening, B2 HeadObject 403 handling, CAS-key case dedup)
    "genblaze-core>=0.3.7",
    "genblaze-s3>=0.3.6",
    "genblaze-gmicloud>=0.3.4",
    "openai>=2.48.0",
    # Storage
    "boto3>=1.43.56",
    # Data processing
    "pandas>=3.0.5",
    # Logging
    "structlog>=24.2.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Retry / resilience
    "tenacity>=8.2.0",
    # Video / Audio
    "ffmpeg-python>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pre-commit>=3.7.0",
    "matplotlib>=3.11.0",
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "tests"]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=backend --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["backend"]
omit = ["*/tests/*", "*/__init__.py", "backend/media/genblaze_client.py"]

[tool.coverage.report]
fail_under = 80

