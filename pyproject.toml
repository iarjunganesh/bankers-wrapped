[tool.poetry]
name = "bankers-wrapped"
version = "1.0.0"
description = "AI-powered financial storytelling platform — Backblaze Generative Media Hackathon 2026"
authors = ["Arjun Ganesh <arjun@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "backend" }]

[tool.poetry.dependencies]
python = "^3.12"

# Web framework
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
python-multipart = "^0.0.9"

# Config
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"

# AI / Genblaze
genblaze-core = "*"
genblaze-s3 = "*"
genblaze-gmicloud = "*"
genblaze-elevenlabs = "*"
openai = "^1.30.0"

# Storage
boto3 = "^1.34.0"

# Data processing
pandas = "^2.2.0"

# Logging
structlog = "^24.2.0"

# Video / Audio
ffmpeg-python = "^0.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.14.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
ruff = "^0.4.0"
mypy = "^1.10.0"
pre-commit = "^3.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=backend --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["backend"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 70
