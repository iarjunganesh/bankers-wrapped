<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Inter loaded here (not in banner-*.svg) purely so the SVG's <text> elements render with the
     real typeface during a 2x export — see the README's re-export script. The SVG itself falls
     back to system fonts when viewed standalone (e.g. GitHub's README renderer), which is fine. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=block" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  body[data-theme="dark"]  { background:#0a0a0f; }
  body[data-theme="light"] { background:#eef0f7; }
  img { width:1920px; height:auto; display:block; }
  /* ?native=1 — 1:1 crop at the SVG's own size (1000x410), no letterbox canvas.
     Used for the *-native.png reference renders; see the README's re-export script. */
  html.native, html.native body { width:1000px; height:410px; }
  html.native img { width:1000px; }

  .toggle {
    position:fixed; top:22px; right:26px; z-index:10; cursor:pointer;
    width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.06); color:#9a9ab5; border:1px solid rgba(255,255,255,0.14);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  body[data-theme="light"] .toggle { background:rgba(35,42,80,0.05); color:#5c617b; border-color:rgba(35,42,80,0.16); }
  .toggle .icon { width:24px; height:24px; }
  .icon-sun { display:none; }
  body[data-theme="light"] .icon-sun  { display:block; }
  body[data-theme="light"] .icon-moon { display:none; }
  body.rendering .toggle { display:none; }   /* hidden when a ?theme= is forced (i.e. during PNG export) */
</style>
</head>
<body>
  <button id="t" type="button" class="toggle" aria-label="Toggle theme">
    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/>
    </svg>
    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.3"/>
      <path d="M12 1.5V4M12 20v2.5M4.2 4.2 6 6M18 18l1.8 1.8M1.5 12H4M20 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8"/>
    </svg>
  </button>
  <img id="card" src="banner-dark.svg" alt="Banker's Wrapped">
  <script>
    (function () {
      var img = document.getElementById('card');
      function setTheme(t) {
        document.body.setAttribute('data-theme', t);
        img.src = t === 'light' ? 'banner-light.svg' : 'banner-dark.svg';
      }
      var params = new URLSearchParams(location.search);
      var forced = params.get('theme');
      if (params.get('native') === '1') {
        document.documentElement.classList.add('native');
      }
      if (forced === 'light' || forced === 'dark') {
        setTheme(forced);
        document.body.classList.add('rendering');   // clean export — no toggle button
      } else {
        setTheme('dark');                            // interactive preview defaults to dark
        document.getElementById('t').addEventListener('click', function () {
          setTheme(document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        });
      }
    })();
  </script>
</body>
</html>
