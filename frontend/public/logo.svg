<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1b2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <!--
      Arc gradient: referenced inside <g transform="translate(10,20) scale(0.833)">,
      so userSpaceOnUse coordinates are in the icon's local space (x: 16→104).
    -->
    <linearGradient id="arc" x1="16" y1="0" x2="104" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F59E0B"/>
      <stop offset="25%"  stop-color="#14B8A6"/>
      <stop offset="50%"  stop-color="#8B5CF6"/>
      <stop offset="75%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <!-- Text gradient for "WRAPPED" in outer SVG coordinate space -->
    <linearGradient id="text" x1="126" y1="0" x2="390" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F59E0B"/>
      <stop offset="25%"  stop-color="#14B8A6"/>
      <stop offset="50%"  stop-color="#8B5CF6"/>
      <stop offset="75%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Icon block: 120×120 icon displayed at 100×100, offset (10,20) -->
  <g transform="translate(10,20) scale(0.833)">
    <rect width="120" height="120" rx="26" fill="url(#bg)"/>
    <rect x="8"  y="32" width="16" height="72" rx="4" fill="#F59E0B"/>
    <rect x="30" y="68" width="16" height="36" rx="4" fill="#14B8A6"/>
    <rect x="52" y="50" width="16" height="54" rx="4" fill="#8B5CF6"/>
    <rect x="74" y="68" width="16" height="36" rx="4" fill="#3B82F6"/>
    <rect x="96" y="32" width="16" height="72" rx="4" fill="#6366f1"/>
    <path d="M 16,32 C 27,32 27,68 38,68 C 49,68 49,50 60,50 C 71,50 71,68 82,68 C 93,68 93,32 104,32"
          stroke="url(#arc)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="128" y="55"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="12" font-weight="600"
        fill="#555" letter-spacing="4">BANKER&apos;S</text>
  <text x="126" y="96"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="42" font-weight="800"
        fill="url(#text)" letter-spacing="-1">WRAPPED</text>
  <text x="128" y="116"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="12" font-weight="400"
        fill="#3d3d55" letter-spacing="0.3">Your financial year, told as a story.</text>
</svg>
