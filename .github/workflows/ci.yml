name: CI Quality Gate

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  quality:
    runs-on: ubuntu-latest

    # Fake credentials satisfy Settings() defaults; tests mock all outbound calls
    env:
      GMI_API_KEY: "mock-gmi-key-for-testing-only"
      NVIDIA_NIM_API_KEY: ""
      OPENAI_API_KEY: "sk-mock-openai-key-for-testing-only"
      B2_ENDPOINT_URL: "https://s3.eu-central-003.backblazeb2.com"
      B2_KEY_ID: "mock_b2_key_id"
      B2_APPLICATION_KEY: "mock_b2_application_key"
      B2_BUCKET_NAME: "bankers-wrapped-test-bucket"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Type check (Mypy)
        run: uv run mypy backend/

      - name: Tests + coverage gate
        run: |
          uv run pytest tests/unit tests/integration \
            --cov=backend \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
